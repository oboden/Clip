<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: Inter, sans-serif;
    font-size: 12px;
    background: #2c2c2c;
    color: #fff;
    width: 260px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    background: #1e1e1e;
    border-bottom: 1px solid #3a3a3a;
  }

  .header h1 {
    font-size: 13px;
    font-weight: 600;
  }

  .toggle-btn {
    background: none;
    border: none;
    color: #aaa;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 0 4px;
  }

  .toggle-btn:hover { color: #fff; }

  .body { padding: 10px; }

  .save-btn {
    width: 100%;
    padding: 8px;
    background: #18a0fb;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    margin-bottom: 10px;
  }

  .save-btn:hover { background: #0d8de0; }

  .empty {
    text-align: center;
    color: #666;
    padding: 20px 0;
  }

  .item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    background: #3a3a3a;
    border-radius: 6px;
    margin-bottom: 6px;
  }

  .item-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
  }

  .item-name {
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 150px;
  }

  .item-type {
    color: #888;
    font-size: 10px;
    text-transform: uppercase;
  }

  .item-actions {
    display: flex;
    gap: 6px;
  }

  .paste-btn, .delete-btn {
    border: none;
    border-radius: 4px;
    padding: 4px 8px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 500;
  }

  .paste-btn {
    background: #18a0fb;
    color: #fff;
  }

  .paste-btn:hover { background: #0d8de0; }

  .delete-btn {
    background: #555;
    color: #ccc;
  }

  .delete-btn:hover { background: #e03; color: #fff; }

  .error {
    color: #f66;
    font-size: 11px;
    margin-bottom: 8px;
    text-align: center;
  }

  .collapsed .body { display: none; }
</style>
</head>
<body>

<div id="container">
  <div class="header">
    <h1>Clipboard</h1>
    <button class="toggle-btn" id="toggle">−</button>
  </div>
  <div class="body">
    <button class="save-btn" id="save">Save Selection</button>
    <div id="error" class="error" style="display:none"></div>
    <div id="list"><p class="empty">Nothing saved yet</p></div>
  </div>
</div>

<script>
  let items = [];
  let collapsed = false;

  const container = document.getElementById('container');
  const toggle = document.getElementById('toggle');
  const list = document.getElementById('list');
  const errorEl = document.getElementById('error');

toggle.onclick = () => {
    collapsed = !collapsed;
    container.classList.toggle('collapsed', collapsed);
    toggle.textContent = collapsed ? '+' : '−';
    parent.postMessage({ 
      pluginMessage: { 
        type: 'resize', 
        height: collapsed ? 40 : 400 
      } 
    }, '*');
  };

  document.getElementById('save').onclick = () => {
    parent.postMessage({ pluginMessage: { type: 'save-selection' } }, '*');
  };

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
    setTimeout(() => errorEl.style.display = 'none', 2000);
  }

  function renderList() {
    if (items.length === 0) {
      list.innerHTML = '<p class="empty">Nothing saved yet</p>';
      return;
    }

    list.innerHTML = items.map(item => `
      <div class="item">
        <div class="item-info">
          <span class="item-name" title="${item.name}">${item.name}</span>
          <span class="item-type">${item.type}</span>
        </div>
        <div class="item-actions">
          <button class="paste-btn" data-id="${item.id}">Paste</button>
          <button class="delete-btn" data-id="${item.id}">✕</button>
        </div>
      </div>
    `).join('');

    list.querySelectorAll('.paste-btn').forEach(btn => {
      btn.onclick = () => {
        parent.postMessage({ pluginMessage: { type: 'paste-item', id: btn.dataset.id } }, '*');
      };
    });

    list.querySelectorAll('.delete-btn').forEach(btn => {
      btn.onclick = () => {
        parent.postMessage({ pluginMessage: { type: 'delete-item', id: btn.dataset.id } }, '*');
      };
    });
  }

  window.onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === 'items-updated') {
      items = msg.items;
      renderList();
    }

    if (msg.type === 'error') {
      showError(msg.message);
    }
  };
</script>
</body>
</html>
